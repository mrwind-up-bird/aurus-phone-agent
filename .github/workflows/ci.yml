name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: cd agent && uv sync --dev

      - name: Run tests with coverage
        run: cd agent && uv run pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Lint
        run: cd agent && uv run ruff check src/

      - name: Format check
        run: cd agent && uv run ruff format --check src/

  frontend-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_LIVEKIT_URL: wss://test.livekit.cloud
      LIVEKIT_API_KEY: test-key
      LIVEKIT_API_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Build
        run: cd frontend && npm run build
