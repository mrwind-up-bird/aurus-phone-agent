services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    env_file: .env
    restart: unless-stopped
    networks:
      - aurus
    # UDP ports for WebRTC (LiveKit handles via SFU, but agent may need these)
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    env_file: .env
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - aurus
    depends_on:
      - agent

networks:
  aurus:
    driver: bridge
