services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    env_file: .env
    restart: unless-stopped
    networks:
      - aurus
    volumes:
      - conversation-data:/app/agent/data/conversations

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
    env_file: .env
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - aurus
    depends_on:
      - agent
    volumes:
      # Mount conversation data so the API routes can read saved calls
      - conversation-data:/app/agent/data/conversations:ro

volumes:
  conversation-data:

networks:
  aurus:
    driver: bridge
